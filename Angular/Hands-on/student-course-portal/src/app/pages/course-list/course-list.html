<h2>Available Courses</h2>

<div *ngIf="selectedSemester">
  <strong>Semester:</strong> {{ selectedSemester }}
</div>

<div *ngIf="loading$ | async">
  Loading Courses...
</div>

<div *ngIf="error$ | async as error" class="error">
  {{ error }}
</div>

<div *ngFor="let course of (courses$ | async)">
  <app-course-card
    [course]="course">
  </app-course-card>

  <br>

  <button (click)="viewCourse(course.id)">
    View Details
  </button>

  <hr>
</div>
