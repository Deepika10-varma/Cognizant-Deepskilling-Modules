<h2>Student Enrollment Form</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <!-- Student Name -->
  <label>Name</label><br>

  <input
    type="text"
    name="studentName"
    [(ngModel)]="studentName"
    required
    minlength="3"
    #nameCtrl="ngModel">

  <div class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
    Name is required
  </div>

  <div class="error" *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
    Name must be at least 3 characters
  </div>

  <br>

  <!-- Email -->
  <label>Email</label><br>

  <input
    type="email"
    name="studentEmail"
    [(ngModel)]="studentEmail"
    required
    email
    #emailCtrl="ngModel">

  <div class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
    Email is required
  </div>

  <div class="error" *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
    Enter a valid email
  </div>

  <br>

  <!-- Course ID -->
  <label>Course ID</label><br>

  <input
    type="number"
    name="courseId"
    [(ngModel)]="courseId"
    required
    #courseCtrl="ngModel">

  <div class="error" *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
    Course ID is required
  </div>

  <br>

  <!-- Semester -->
  <label>Preferred Semester</label><br>

  <select
    name="preferredSemester"
    [(ngModel)]="preferredSemester">

    <option value="Odd">Odd</option>
    <option value="Even">Even</option>

  </select>

  <br><br>

  <!-- Checkbox -->

  <label>

    <input
      type="checkbox"
      name="agreeToTerms"
      [(ngModel)]="agreeToTerms"
      required
      #termsCtrl="ngModel">

    I agree to the Terms & Conditions

  </label>

  <div class="error"
       *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
    Please accept the terms.
  </div>

  <br>

  <!-- Success Message -->

  <div class="success" *ngIf="submitted">
    Enrollment request submitted successfully!
  </div>

  <br>

  <!-- Buttons -->

  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit

  </button>

  &nbsp;

  <button
    type="button"
    (click)="enrollForm.resetForm()">

    Reset

  </button>

</form>
