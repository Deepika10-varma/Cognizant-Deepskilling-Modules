<h2>Reactive Enrollment Form</h2>

<form [formGroup]="enrollForm"
      (ngSubmit)="onSubmit()">

  <label>Student Name</label><br>

  <input
      type="text"
      formControlName="studentName">

  <div class="error"
       *ngIf="enrollForm.get('studentName')?.touched &&
              enrollForm.get('studentName')?.errors?.['required']">

      Name is required

  </div>

  <div class="error"
       *ngIf="enrollForm.get('studentName')?.touched &&
              enrollForm.get('studentName')?.errors?.['minlength']">

      Name must be at least 3 characters

  </div>

  <br>

  <label>Email</label><br>

  <input
      type="email"
      formControlName="studentEmail">

  <div class="error"
       *ngIf="enrollForm.get('studentEmail')?.touched &&
              enrollForm.get('studentEmail')?.errors?.['required']">

      Email is required

  </div>

  <div class="error"
       *ngIf="enrollForm.get('studentEmail')?.touched &&
              enrollForm.get('studentEmail')?.errors?.['email']">

      Enter a valid email

  </div>

  <br>

  <label>Course ID</label><br>

  <input
      type="text"
      formControlName="courseId">

  <div class="error"
       *ngIf="enrollForm.get('courseId')?.touched &&
              enrollForm.get('courseId')?.errors?.['required']">

      Course ID is required

  </div>

  <div class="error"
       *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">

      Course code starting with XX is not allowed.

  </div>

  <br>

  <label>Preferred Semester</label><br>

  <select formControlName="preferredSemester">

      <option value="Odd">Odd</option>
      <option value="Even">Even</option>

  </select>

  <br><br>

  <label>

      <input
          type="checkbox"
          formControlName="agreeToTerms">

      I agree to the Terms & Conditions

  </label>

  <br><br>

  <h3>Skills</h3>

  <div formArrayName="skills">

      <div *ngFor="let skill of skills.controls; let i = index">

          <input
              type="text"
              [formControlName]="i"
              placeholder="Enter Skill">

      </div>

  </div>

  <br>

  <button
      type="button"
      (click)="addSkill()">

      Add Skill

  </button>

  <br><br>

  <button
      type="submit"
      [disabled]="enrollForm.invalid">

      Submit

  </button>

</form>
